name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Configure CMake
        # Deliberately no -G: runner images rotate their Visual Studio version, and pinning
        # one ("Visual Studio 17 2022") breaks the Windows job the moment the image moves on.
        # CMake's per-platform default is correct on all three runners.
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Check generated protocol catalog
        run: cmake --build build --config Release --target copilot_codegen_check
